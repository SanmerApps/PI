name: Android

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'jetbrains'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-publish: false
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build
        id: build
        run: |
          if [ ! -z "${{ secrets.KEY_STORE }}" ]; then
            echo key.store.password='${{ secrets.KEY_STORE_PASSWORD }}' > signing.properties
            echo key.alias='${{ secrets.KEY_ALIAS }}' >> signing.properties
            echo key.password='${{ secrets.KEY_PASSWORD }}' >> signing.properties
            echo key.store='${{ github.workspace }}/key.jks' >> signing.properties
            echo ${{ secrets.KEY_STORE }} | base64 --decode > ${{ github.workspace }}/key.jks
          fi
          ./gradlew assembleRelease
          name=`ls app/build/outputs/apk/release/*.apk | awk -F '(/|.apk)' '{print $6}'` && echo "name=${name}" >> $GITHUB_OUTPUT

      - name: Upload apk
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: app/build/outputs/apk/release/*.apk*

      - name: Upload mapping
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}-mapping
          path: app/build/outputs/mapping/release

      - name: Publish to Telegram channel
        if: success() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          if [ ! -z "${{ secrets.BOT_TOKEN }}" ]; then
            RELEASE=$(find app/build/outputs/apk/release -name "*.apk")
            ESCAPED=$(python3 -c 'import json,os; print(json.dumps("${{ github.event.head_commit.message }}"))')
            curl -v "https://api.telegram.org/bot${{ secrets.BOT_TOKEN }}/sendMediaGroup" \
              -F "chat_id=${{ secrets.CHANNEL_ID }}" \
              -F "media=[{\"type\":\"document\",\"media\":\"attach://release\",\"caption\":${ESCAPED}}]" \
              -F "release=@${RELEASE}"
          fi
